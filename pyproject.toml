[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlib"
version = "0.1.0"
description = "mlib — file, tag and cover your music collection to one standard (for gonic/jukebox)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Martin Hinge" }]
dependencies = [
    "typer>=0.12",
    "mutagen>=1.47",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mlib = "mlib.cli:app"

[tool.setuptools]
packages = ["mlib", "mlib.assets"]

[tool.pytest.ini_options]
testpaths = ["tests"]